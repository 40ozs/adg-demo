# Generated by 40ozs/synthetic-enterprise tools/cutover/demo_release.py (templates/adg/hosted-verify.yml).
# Do not edit here: this repository is a release mirror, and a hand edit fails the release verifier.
#
# Hosted verification (ADG demo), ADG-HOSTED-VERIFY-NODEPLOY-01: validates the demo that is deployed NOW,
# without changing it. It cannot deploy, bootstrap, reset or migrate: no step calls wrangler, the Render
# deploy API, `demo_mode reset`/`scan`, alembic or any other write path, and every database session is
# forced read-only (demo-release/read_only_db.py). Deploying stays in "Free staging (ADG demo)"
# (cloudflare-staging.yml). Manual dispatch only.
#
# Each job is its own failure class:
#   identity   source topology and release provenance of the live Render deploy + Worker version
#              (synthetic-enterprise tools/cutover/hosted_identity.py --app adg; GET requests and git fetch only)
#   checks     read-only Demo Mode verify + logical fingerprint + findings against the authorizing release's
#              expected values, HTTP smoke, browser gate, database state before/after
#   unchanged  a second identity read after the checks equals the first (nothing was deployed meanwhile)
#
# Secrets read from the `cloudflare-staging` environment (no deployment record is created): ADG_DATABASE_URL
# (read-only sessions), RENDER_API_KEY and CLOUDFLARE_API_TOKEN (GET only), SE_READ_SSH_KEY (a read-only
# deploy key of the private 40ozs/synthetic-enterprise, for its release history). Never read here:
# ADG_ORIGIN_KEY, CLOUDFLARE_ACCOUNT_ID.
name: Hosted verification (ADG demo)

on:
  workflow_dispatch:

permissions:
  contents: read

# The deploy workflow's group: a verification never overlaps a deploy of the same demo.
concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Deployment identity and source topology (read-only)
    runs-on: [self-hosted, Linux, X64, demo-release]
    timeout-minutes: 20
    environment:
      name: cloudflare-staging
      deployment: false
    outputs:
      expected: ${{ steps.reconcile.outputs.expected }}
    steps: &identity-steps
      - uses: actions/checkout@v4
        with:
          path: adg-demo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 40ozs/adg
          path: adg
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 40ozs/synthetic-enterprise
          ref: main
          path: se
          fetch-depth: 0
          ssh-key: ${{ secrets.SE_READ_SSH_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Discover the live deployment; reconcile it with the release history
        id: reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OUT: identity-${{ github.job }}.json
        run: |
          python3 se/tools/cutover/hosted_identity.py --app adg --adg adg --adg-demo adg-demo --out "$OUT" || true
          test -s "$OUT"
          echo "expected=$(jq -c .adg.expected "$OUT")" >> "$GITHUB_OUTPUT"
          jq -r '.adg | "## ADG live identity (\(env.OUT))",
            "- Render deploy: `\(.live.render.deploy)` @ `\(.live.render.commit[:12])` (\(.live.render.repo | sub(".*github.com/"; "")) `\(.live.render.branch)`, auto-deploy \(.live.render.auto_deploy))",
            "- Worker version: `\(.live.worker.version)` (tag `\(.live.worker.tag)`)",
            "- adg-demo main: `\(.demo.main)`; release `\(.demo.provenance.release_id)` (release commit `\(.demo.release_commit)`)",
            "- authorizing lane: \(.authorized_by.render_deploy.lane) (first record \(.authorized_by.render_deploy.first_record.repository) `\(.authorized_by.render_deploy.first_record.commit)`)",
            "- legacy 40ozs/adg deploy workflow: \(.live.legacy_source_workflow)",
            "- reconciled: **\(.reconciled)** \(.problems)"' "$OUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Source topology (repository, branch, auto-deploy, dataset, legacy workflow)
        env:
          OUT: identity-${{ github.job }}.json
        run: |
          jq -e '[.adg.problems[] | select(test("^(deployment source|Render repo|Render branch|Render auto-deploy|ADG_DEMO_DATASET|workers.dev|legacy 40ozs/adg)"))]
            | if length == 0 then true else ("SOURCE TOPOLOGY MISMATCH: \(.)" | halt_error(1)) end' "$OUT"
      - name: Release provenance (live IDs first recorded by an authorized release lane)
        env:
          OUT: identity-${{ github.job }}.json
        run: |
          jq -e '[.adg.problems[] | select(test("^(deployment source|Render repo|Render branch|Render auto-deploy|ADG_DEMO_DATASET|workers.dev|legacy 40ozs/adg)") | not)]
            | if length == 0 then true else ("HOSTED RELEASE PROVENANCE GAP: \(.)" | halt_error(1)) end' "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-${{ github.job }}
          path: identity-${{ github.job }}.json
      # The same steps run again as job `unchanged`, after the checks; only there:
      - uses: actions/download-artifact@v4
        if: github.job == 'unchanged'
        with:
          name: identity-identity
      - name: Live deployment after = before (Render deploy, Worker version, service settings)
        if: github.job == 'unchanged'
        run: |
          jq -e -n --slurpfile b identity-identity.json --slurpfile a identity-unchanged.json \
            'if $b[0].adg.live == $a[0].adg.live then true else ("DEPLOYMENT CHANGED DURING VERIFICATION" | halt_error(1)) end'
          echo "- deployment unchanged: Render \`$(jq -r .adg.live.render.deploy identity-unchanged.json)\`, Worker \`$(jq -r .adg.live.worker.version identity-unchanged.json)\`" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Hosted checks (read-only database, smoke, browser)
    needs: [identity]
    runs-on: [self-hosted, Linux, X64, demo-release]
    timeout-minutes: 40
    environment:
      name: cloudflare-staging
      deployment: false
    env:
      EXPECTED: ${{ needs.identity.outputs.expected }}
      # Read-only by construction: every session runs SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY first.
      READ_ONLY_DB: >-
        docker run --rm -i -v ${{ github.workspace }}/demo-release/read_only_db.py:/verify/read_only_db.py:ro
        -e ADG_DATABASE_URL -e ADG_RUNTIME_MODE=demo -e ADG_DEMO_DATASET=genesee-press-v1 -e ADG_LOG_LEVEL=WARNING
        adg-api:verify python /verify/read_only_db.py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Mask the database host
        env:
          ADG_DATABASE_URL: ${{ secrets.ADG_DATABASE_URL }}
        run: echo "::add-mask::$(python3 -c 'import os; from urllib.parse import urlsplit; print(urlsplit(os.environ["ADG_DATABASE_URL"]).hostname or "")')"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the API image of this commit (local only, never pushed)
        run: docker build -q -f docker/Dockerfile.backend -t adg-api:verify . >/dev/null
      - name: Database state before (read-only)
        env:
          ADG_DATABASE_URL: ${{ secrets.ADG_DATABASE_URL }}
        run: $READ_ONLY_DB state > db-state-before.json
      - name: Demo Mode verify, logical fingerprint, findings (read-only) = the authorizing release's expected values
        env:
          ADG_DATABASE_URL: ${{ secrets.ADG_DATABASE_URL }}
        run: |
          $READ_ONLY_DB run -m app.demo_mode --json verify > verify.json
          $READ_ONLY_DB run - < frontend/cloudflare/checks/genesee_press_fingerprint.py > gp-fingerprint.json
          python3 - <<'EOF'
          import json, os
          expected = json.loads(os.environ["EXPECTED"])
          verify, gp, state = (json.load(open(f)) for f in ("verify.json", "gp-fingerprint.json", "db-state-before.json"))
          rows = [
              ("Demo Mode verify ok", verify["ok"], True),
              ("probes", f"{verify['probes']}/{verify['probes']}", expected["probes"]),
              ("Demo Mode fingerprint", verify["fingerprint"], expected["demo_mode_fingerprint"]),
              ("logical fingerprint", gp["fingerprint"], expected["logical_fingerprint"]),
              ("logical fingerprint match", gp["match"], True),
              ("open findings", state["findings_by_status"].get("open"), expected["findings_open"]),
              ("database", state["database"], "adg_demo"),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Database (read-only)\n\n| Check | Live | Expected |\n|---|---|---|\n")
              summary.writelines(f"| {name} | `{live}` | `{want}` |\n" for name, live, want in rows)
          failed = [name for name, live, want in rows if live != want]
          for name, live, want in rows:
              print(f"{'PASS' if live == want else 'FAIL'}  {name}: {live} (expected {want})")
          if failed:
              raise SystemExit(f"DATASET CONTRACT MISMATCH: {failed}")
          EOF
      - name: HTTP smoke
        env:
          STAGING_URL: ${{ vars.ADG_STAGING_URL }}
          RENDER_ORIGIN: ${{ vars.ADG_RENDER_ORIGIN }}
          ADG_DATABASE_URL: ${{ secrets.ADG_DATABASE_URL }}
        run: |
          # The database host is a canary no answer may contain; derived here, never printed.
          SMOKE_CANARIES="$(python3 -c 'import os; from urllib.parse import urlsplit; print(urlsplit(os.environ["ADG_DATABASE_URL"]).hostname or "")')"
          export SMOKE_CANARIES
          unset ADG_DATABASE_URL
          node frontend/cloudflare/checks/smoke.mjs | tee smoke.log
          echo "- HTTP smoke: $(grep -c '^PASS ' smoke.log) passed, $(grep -c '^FAIL ' smoke.log || true) failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Browser gate (headless Chromium)
        env:
          STAGING_URL: ${{ vars.ADG_STAGING_URL }}
          SCREENSHOT_DIR: screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium  # the runner image carries Chromium's system libraries
          node frontend/cloudflare/checks/browser.mjs | tee browser.log
          echo "- Browser gate: $(grep -c '^PASS ' browser.log) passed, $(grep -c '^FAIL ' browser.log || true) failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Database state after (read-only); dataset and audit trail unchanged
        if: always()
        env:
          ADG_DATABASE_URL: ${{ secrets.ADG_DATABASE_URL }}
        run: |
          $READ_ONLY_DB state > db-state-after.json
          $READ_ONLY_DB run -m app.demo_mode --json verify > verify-after.json
          python3 - <<'EOF'
          import json, os
          before, after, v1, v2 = (json.load(open(f)) for f in ("db-state-before.json", "db-state-after.json", "verify.json", "verify-after.json"))
          writes = {t: {k: c[k] - before["write_counters"].get(t, {}).get(k, 0) for k in c}
                    for t, c in after["write_counters"].items()}
          writes = {t: d for t, d in writes.items() if any(d.values())}
          json.dump({"tables_written_during_run": writes}, open("db-writes.json", "w"), indent=1, sort_keys=True)
          rows = [
              ("Demo Mode fingerprint", v1["fingerprint"], v2["fingerprint"]),
              ("findings by status", before["findings_by_status"], after["findings_by_status"]),
              ("governance audit trail", before["governance_audit_events"], after["governance_audit_events"]),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n## Database before/after\n\n| | Before | After |\n|---|---|---|\n")
              summary.writelines(f"| {name} | `{b}` | `{a}` |\n" for name, b, a in rows)
              summary.write(f"\nTables any client wrote to during the run (pg_stat_user_tables): `{writes or 'none'}`\n")
          print("tables written during the run:", writes or "none")
          changed = [name for name, b, a in rows if b != a]
          if changed:
              raise SystemExit(f"HOSTED DATASET CHANGED DURING VERIFICATION: {changed}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-checks
          path: |
            db-state-before.json
            db-state-after.json
            db-writes.json
            verify.json
            verify-after.json
            gp-fingerprint.json
            smoke.log
            browser.log
            screenshots/

  unchanged:
    name: Deployment unchanged after the checks (read-only)
    needs: [identity, checks]
    if: ${{ always() && needs.identity.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, demo-release]
    timeout-minutes: 20
    environment:
      name: cloudflare-staging
      deployment: false
    steps: *identity-steps
